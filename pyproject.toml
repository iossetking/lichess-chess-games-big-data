[project]
name = "lichess-chess-games-big-data"
version = "0.1.0"
description = "Lichess standard chess games: Big Data pipeline for per-move win probability"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chess>=1.11.2",
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "opencv-contrib-python>=4.11",
    "polars>=2.0.0",
    "torch>=2.6.0",
    "zstandard>=0.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "lichess_pipeline"
module-root = "src"

[tool.ruff.lint.per-file-ignores]
# marimo cells need explicit returns and bare display expressions.
"notebooks/*.py" = ["PLR1711", "B018"]
